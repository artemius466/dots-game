server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for routes/assets that don't exist on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable, content-hashed assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
