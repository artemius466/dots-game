# Dots Game — compose the authoritative server and the Vite client together.
#   docker compose up --build
# Then open http://localhost:5173 (UI) ; http://localhost:4000/api/health (server)
#
# Ports / base URL are read from the co-located .env file.
services:
  server:
    build:
      context: ./server
    image: dots-game-server
    environment:
      # server/src/types.ts reads process.env.PORT (default 4000)
      PORT: ${SERVER_PORT:-4000}
    ports:
      - "${SERVER_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:4000/api/health', r => {let d=''; r.on('data', c => d += c); r.on('end', () => process.exit(r.statusCode < 400 ? 0 : 1))}).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s

  client:
    build:
      context: ./client
      args:
        # Inlined into the bundle at build time; the browser reaches the server
        # directly on host :4000 (client is served from :5173).
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:4000}
    image: dots-game-client
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - server
    restart: unless-stopped
